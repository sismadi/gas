name = "lms-microservice"
main = "worker.js"
compatibility_date = "2026-01-01"

# Deploy dengan:
#   wrangler d1 create lms_db
#   (salin database_id hasilnya ke bawah ini)
#   wrangler d1 execute lms_db --remote --file=./schema.sql
#   wrangler deploy

[[d1_databases]]
binding = "DB"                     # diakses di worker.js sebagai env.DB
database_name = "lms"
database_id = "GANTI-DENGAN-DATABASE-ID-ANDA"

[vars]
APP_NAME = "LMS Microservice"

# Opsional: batasi origin frontend yang boleh akses API
# ganti "*" di worker.js (fungsi corsHeaders) sesuai domain frontend Anda.
